  for (const [f, ph] of [[rama, 0], [vish, 1.7]]) { const b = Math.sin(T * 1.5 + ph); f.hips.position.y = 0.95 + b * 0.004; f.hips.scale.set(1 + b * 0.006, 1, 1 + b * 0.012); f.head.rotation.x += (Math.sin(T * 0.6 + ph) * 0.02 - 0) * dt * 0.2; f.sway.forEach((s, i) => { s.rotation.z = Math.sin(T * 1.3 + i + ph) * 0.02; s.rotation.x = Math.sin(T * 0.9 + i * 2) * 0.015; }); }
  vish.bless.material.opacity = 0.45 + Math.sin(T * 2) * 0.25;
  place.flames.forEach((m, i) => { m.scale.set(1 + Math.sin(T * 9 + i) * 0.1, 1 + Math.sin(T * 12 + i * 2) * 0.18, 1); m.rotation.y = T * (1 + i); });
  place.fl.intensity = 1.1 + Math.sin(T * 13) * 0.2 + Math.sin(T * 7.3) * 0.15; place.fg.material.opacity = 0.5 + Math.sin(T * 10) * 0.1; place.lamps.forEach((l, i) => { l.material.opacity = 0.8 + Math.sin(T * 8 + i * 3) * 0.15; });
  rays.forEach((m, i) => { m.material.opacity = 0.055 + Math.sin(T * 0.4 + i) * 0.025; });
  const p = dgeo.attributes.position; for (let i = 0; i < DN; i++) { p.array[i * 3 + 1] += dt * 0.05; p.array[i * 3] += Math.sin(T * 0.3 + i) * dt * 0.02; if (p.array[i * 3 + 1] > 5) p.array[i * 3 + 1] = 0; } p.needsUpdate = true;
  renderer.render(scene, cam);
}
